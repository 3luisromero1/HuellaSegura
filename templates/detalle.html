{% extends 'base.html' %}{% block contenido %}<h1>Reporte #{{ reporte.id }}</h1><div class="tarjeta detalle"><p><strong>Tipo:</strong> {{ reporte.tipo }}</p><p><strong>Ubicación:</strong> {{ reporte.ubicacion }}</p><p><strong>Estado:</strong> {{ reporte.estado }}</p><p><strong>Fecha:</strong> {{ reporte.fecha }}</p><p><strong>Descripción:</strong></p><p class="descripcion">{{ reporte.descripcion }}</p><div class="acciones"><a class="boton" href="{{ url_for('editar', id=reporte.id) }}">Editar</a><form method="post" action="{{ url_for('eliminar', id=reporte.id) }}" onsubmit="return confirm('¿Seguro que deseas eliminar este reporte?');"><button class="peligro" type="submit">Eliminar</button></form><a href="{{ url_for('inicio') }}">Volver</a></div></div>{% endblock %}
