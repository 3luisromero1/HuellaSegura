{% extends 'base.html' %}{% block contenido %}<h1>{{ titulo }}</h1><div class="tarjeta formulario"><form method="post"><label for="tipo">Tipo de situación</label><select id="tipo" name="tipo" required><option value="">Seleccionar...</option>{% for t in tipos %}<option value="{{ t }}" {% if reporte and reporte['tipo']==t %}selected{% endif %}>{{ t }}</option>{% endfor %}</select><label for="ubicacion">Ubicación</label><input id="ubicacion" name="ubicacion" maxlength="200" required value="{{ reporte['ubicacion'] if reporte else '' }}" placeholder="Barrio, municipio o referencia"><label for="descripcion">Descripción del caso</label><textarea id="descripcion" name="descripcion" minlength="10" required rows="5" placeholder="Explica qué ocurrió...">{{ reporte['descripcion'] if reporte else '' }}</textarea><label for="estado">Estado</label><select id="estado" name="estado">{% for e in estados %}<option value="{{ e }}" {% if reporte and reporte['estado']==e %}selected{% endif %}>{{ e }}</option>{% endfor %}</select><div class="acciones"><button class="boton" type="submit">Guardar reporte</button><a href="{{ url_for('inicio') }}">Cancelar</a></div></form></div>{% endblock %}
